# CI：双平台矩阵运行单元测试。
# ubuntu + windows 缺一不可：ExecuteCommandTool 按平台分支（cmd /c 与 sh -c），
# 文件工具的路径处理也有平台差异，单平台测不出另一边的回归。
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: mvn test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 运行测试
        run: mvn -B test
